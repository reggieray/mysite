        let allProperties = []; 

        // --- HELPER FUNCTIONS ---
        function getFloor(item) {
            if (!item.layout_info) return 0;
            const floorInfo = item.layout_info.find(i => i.includes('F/'));
            return floorInfo ? parseInt(floorInfo.split('F')[0], 10) : 0;
        }

        function getPrice(item) {
            if (!item.price) return 0;
            return parseInt(item.price.toString().replace(/,/g, ''), 10);
        }

        let currentLang = 'en'; // 'en' or 'zh'

        function translateText(text) {
            if (currentLang === 'zh') return text;
            if (!text) return text;
            
            let translated = text;

            // Regex for Layout e.g., "2房1廳1衛" -> "2 Bed 1 Liv 1 Bath"
            translated = translated.replace(/(\d+)房(\d+)廳(\d+)衛/g, '$1 Bed $2 Liv $3 Bath');
            translated = translated.replace(/(\d+)房(\d+)廳/g, '$1 Bed $2 Liv');
            
            // Regex for Floor e.g., "27F/32F" -> "Floor 27 / 32"
            translated = translated.replace(/(\d+)F\/(\d+)F/g, 'Floor $1 / $2');
            
            // Regex for Size e.g., "21.579坪" -> "21.579 Ping"
            translated = translated.replace(/([0-9.]+)坪/g, '$1 Ping');

            // Regex for distance
            translated = translated.replace(/距離本社區約\s*(\d+)?\s*公尺/g, 'Approx $1 meters from community');

            // Replace dictionary terms
            for (const [zh, en] of Object.entries(realEstateDict)) {
                // Global replace using split/join to avoid regex escaping issues
                translated = translated.split(zh).join(en);
            }

            return translated;
        }

        function loadHardcodedData() {
            processDataArray(hardcodedPayloads);
        }

        function loadData() {
            const input = document.getElementById('jsonInput').value;
            const grid = document.getElementById('propertyGrid');
            
            if (!input.trim()) {
                grid.innerHTML = '<div class="error">Please paste some JSON data first.</div>';
                return;
            }

            try {
                let fixedInput = input.trim();
                fixedInput = fixedInput.replace(/\]\s*\[/g, ','); 
                fixedInput = fixedInput.replace(/\}\s*\{/g, '},{'); 
                if (!fixedInput.startsWith('[')) fixedInput = '[' + fixedInput + ']';
                
                const parsedArray = JSON.parse(fixedInput);
                processDataArray(parsedArray);

            } catch (error) {
                console.error("JSON Parsing Error:", error);
                grid.innerHTML = '<div class="error">Error parsing JSON data. Please make sure the copied text is valid. Check the console for details.</div>';
            }
        }

        function processDataArray(parsedArray) {
            let tempData = [];
            
            parsedArray.forEach(item => {
                if (item.data && item.data.list) {
                    tempData = tempData.concat(item.data.list);
                } else if (item.list) {
                    tempData = tempData.concat(item.list);
                } else if (Array.isArray(item)) {
                    tempData = tempData.concat(item);
                } else {
                    tempData.push(item);
                }
            });

            // Deduplicate
            const uniqueProps = new Map();
            tempData.forEach(item => {
                if (item.rent_id) {
                    uniqueProps.set(item.rent_id, item);
                }
            });
            
            allProperties = Array.from(uniqueProps.values());
            
            document.getElementById('propertyGrid').innerHTML = '';
            renderCards();
        }

        // --- CAROUSEL LOGIC ---
        function changeImage(event, rentId, direction) {
            event.preventDefault(); 
            event.stopPropagation();

            const container = document.getElementById(`carousel-${rentId}`);
            if (!container) return;

            const images = container.querySelectorAll('.carousel-img');
            if (images.length <= 1) return;

            let currentIndex = 0;
            for (let i = 0; i < images.length; i++) {
                if (images[i].classList.contains('active')) {
                    currentIndex = i;
                    images[i].classList.remove('active');
                    break;
                }
            }

            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = images.length - 1;
            if (newIndex >= images.length) newIndex = 0;

            images[newIndex].classList.add('active');
            
            const indicator = container.querySelector('.carousel-indicator');
            if (indicator) {
                indicator.innerText = `${newIndex + 1} / ${images.length}`;
            }
        }

        // --- RENDER LOGIC ---
        function renderCards() {
            const grid = document.getElementById('propertyGrid');
            const stats = document.getElementById('statsDisplay');

            if (allProperties.length === 0) {
                stats.innerText = "Loaded 0 properties.";
                grid.innerHTML = '';
                return;
            }

            // Get Filter Values
            const minFloorVal = parseInt(document.getElementById('minFloor').value, 10);
            const maxFloorVal = parseInt(document.getElementById('maxFloor').value, 10);
            const maxPriceVal = parseInt(document.getElementById('maxPrice').value, 10);

            // Filter
            let filteredProps = allProperties.filter(item => {
                const floor = getFloor(item);
                const price = getPrice(item);

                if (!isNaN(minFloorVal) && floor < minFloorVal) return false;
                if (!isNaN(maxFloorVal) && floor > maxFloorVal) return false;
                if (!isNaN(maxPriceVal) && price > maxPriceVal) return false;

                return true;
            });

            // Sort
            const sortMode = document.getElementById('sortSelect').value;
            filteredProps.sort((a, b) => {
                if (sortMode === 'priceAsc') return getPrice(a) - getPrice(b);
                if (sortMode === 'priceDesc') return getPrice(b) - getPrice(a);
                if (sortMode === 'floorAsc') return getFloor(a) - getFloor(b);
                if (sortMode === 'floorDesc') return getFloor(b) - getFloor(a);
                return 0; // default
            });

            // Update stats
            const translatedStats = currentLang === 'en' ? 
                `Showing ${filteredProps.length} of ${allProperties.length} loaded properties.` : 
                `顯示 ${filteredProps.length} / ${allProperties.length} 筆房屋。`;
            stats.innerText = translatedStats;

            // Render
            grid.innerHTML = ''; 
            filteredProps.forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `https://rent.591.com.tw/home/${item.rent_id}`;

                const floorNum = getFloor(item);
                const isIdealFloor = (floorNum >= 8 && floorNum <= 16);

                const layoutPills = (item.layout_info || []).map(info => {

                    const highlightClass = (isFloor && isIdealFloor) ? 'highlight-floor' : '';
                    return `<span class="pill ${highlightClass}">${translateText(info)}</span>`;
                }).join('');
                
                const tags = (item.tags || []).map(tag => `<span class="tag">${translateText(tag)}</span>`).join('');
                
                const communityName = item.community_name ? translateText(item.community_name) : (currentLang === 'en' ? 'Unknown Community' : '未知社區');
                const distanceInfo = item.distance ? (currentLang === 'en' ? ` (Approx ${item.distance}m)` : ` (約 ${item.distance}公尺)`) : '';

                // Build Carousel HTML
                let carouselHTML = `<div class="carousel-container" id="carousel-${item.rent_id}">`;
                
                if (item.pictures && item.pictures.length > 0) {
                    item.pictures.forEach((picUrl, index) => {
                        const activeClass = index === 0 ? 'active' : '';
                        carouselHTML += `<img src="${picUrl}" class="carousel-img ${activeClass}" loading="lazy">`;
                    });
                    
                    if (item.pictures.length > 1) {
                        carouselHTML += `
                            <button class="carousel-btn carousel-prev" onclick="changeImage(event, ${item.rent_id}, -1)">❮</button>
                            <button class="carousel-btn carousel-next" onclick="changeImage(event, ${item.rent_id}, 1)">❯</button>

                        <div class="title" title="${item.title}">${translateText(item.title)}</div>
                        <div class="info-row">
                            <span class="pill highlight-community">${communityName}${distanceInfo}</span>
                            ${layoutPills}
                        </div>
                        <div class="tags">
                            ${tags}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            if (filteredProps.length === 0) {
                const emptyText = currentLang === 'en' ? 'No properties match your current filters.' : '沒有符合條件的房屋。';
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666;">${emptyText}</div>`;
            }
        }
    </script>
</body>
</html>
